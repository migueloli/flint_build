[package]
name = "flint_build"
version = "0.1.0"
edition = "2024"
# Let-chains need 1.88; checked in CI (1.87 fails to compile).
rust-version = "1.88"
description = "A fast, native build_runner replacement for Dart/Flutter projects"
license = "MIT"
repository = "https://github.com/migueloli/flint_build"

[dependencies]
rayon = "1.12"
walkdir = "2.5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
notify = "8.2"
anyhow = "1.0"
colored = "3.1"
tree-sitter = "0.26"
tree-sitter-dart = "0.1"
log = "0.4"
env_logger = "0.11"
tera = "1.20"
serde_json = "1.0"
heck = "0.5"
thiserror = "2.0"
indexmap = { version = "2.14.2", features = ["serde"] }
schemars = "1"

[dev-dependencies]
insta = "1.47"
jsonschema = { version = "0.58.1", default-features = false }
tempfile = "3.27.0"
