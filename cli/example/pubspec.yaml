name: example
description: Example project for flint_build, also used by the benchmark in tool/.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  json_annotation: ^4.11.0

dev_dependencies:
  flint_build:
    path: ../
  lints: ^6.1.0
  # Only for tool/benchmark.dart, which compares Flint with build_runner.
  build_runner: ^2.15.0
  json_serializable: ^6.13.2
