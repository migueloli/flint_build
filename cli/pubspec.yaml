name: flint_build
description: >-
  Fast, native code generation for Dart and Flutter: a build_runner + json_serializable replacement
  powered by a Rust engine. This package is the `dart run flint_build` launcher.
version: 0.1.0
repository: https://github.com/migueloli/flint_build
issue_tracker: https://github.com/migueloli/flint_build/issues
publish_to: none # Not publishable yet: the launcher needs the engine from this repository (REVIEW D1).

environment:
  sdk: ^3.5.0

dependencies:
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
